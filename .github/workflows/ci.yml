name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo +nightly install cargo-audit --version 0.22.2 --locked
      - run: cargo +nightly audit --deny warnings

  spec-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tools -p "test_*.py" -v
      - run: python tools/spec_lint.py --self-test
      - run: python tools/spec_lint.py

  model-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: python tools/run_tlc.py

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        toolchain: ["1.89.0", stable]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: qualification campaign (quick profile)
        run: cargo run -p carolina-cli -- qualify --quick --out qualification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-${{ matrix.os }}
          path: qualification
          if-no-files-found: ignore

  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install the pinned Lean toolchain
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: check the proofs and audit their axioms
        run: python tools/run_lean.py

  release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # the registry has to be populated before licences can be read from vendored sources
      - run: cargo fetch --locked
      - name: the SBOM matches Cargo.lock
        run: python tools/make_sbom.py --check
      - name: the release build is reproducible across source paths
        run: python tools/build_release.py --verify

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - run: cargo +nightly fuzz run dsl_frontend -- -runs=256
      - run: cargo +nightly fuzz run canonical_artifacts -- -runs=256
      - run: cargo +nightly fuzz run wire_protocol -- -runs=256
      - run: cargo +nightly fuzz run storage_formats -- -runs=256
