[package]
name = "carolina-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
carolina-core = { path = "../crates/carolina-core" }
carolina-lang = { path = "../crates/carolina-lang" }
carolina-compiler = { path = "../crates/carolina-compiler" }
carolina-storage = { path = "../crates/carolina-storage" }
carolina-wire = { path = "../crates/carolina-wire" }
carolina-node = { path = "../crates/carolina-node" }

[[bin]]
name = "dsl_frontend"
path = "fuzz_targets/dsl_frontend.rs"
test = false
doc = false
bench = false

[[bin]]
name = "canonical_artifacts"
path = "fuzz_targets/canonical_artifacts.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_protocol"
path = "fuzz_targets/wire_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "storage_formats"
path = "fuzz_targets/storage_formats.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
